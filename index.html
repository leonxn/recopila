<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seguimiento de Conductores</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 8px;
  }
  p.sub {
    color: #94a3b8;
    font-size: 0.9rem;
    margin: 0 0 24px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: #cbd5e1;
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid #334155;
    background: #0f172a;
    color: #f1f5f9;
    font-size: 1rem;
    margin-bottom: 18px;
  }
  input:focus { outline: 2px solid #38bdf8; }
  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled {
    background: #475569;
    color: #94a3b8;
    cursor: not-allowed;
  }
  #status {
    margin-top: 18px;
    font-size: 0.9rem;
    text-align: center;
    min-height: 20px;
  }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .loading { color: #facc15; }
</style>
</head>
<body>
  <div class="card">
    <h1>📍 Registro de ubicación</h1>
    <p class="sub">Ingresa tus datos y comparte tu ubicación actual para el seguimiento.</p>

    <label for="nombre">Nombre / ID del conductor</label>
    <input type="text" id="nombre" placeholder="Ej. Juan Pérez - Unidad 12" required>

    <button id="btnEnviar">Compartir mi ubicación</button>
    <div id="status"></div>
  </div>

<script>
  // ⚠️ Reemplaza esta URL por la de tu Google Apps Script (ver instrucciones)
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbykRa--qjR6EfXHBL0nj5JywqCJZs1vbeznKz64UQFCXB2yCVxxnd6QuchPGSCujda6/exec";

  const btn = document.getElementById("btnEnviar");
  const status = document.getElementById("status");
  const nombreInput = document.getElementById("nombre");

  btn.addEventListener("click", () => {
    const nombre = nombreInput.value.trim();
    if (!nombre) {
      status.textContent = "Por favor ingresa tu nombre o ID.";
      status.className = "err";
      return;
    }

    if (!navigator.geolocation) {
      status.textContent = "Tu navegador no soporta geolocalización.";
      status.className = "err";
      return;
    }

    btn.disabled = true;
    status.textContent = "Obteniendo ubicación...";
    status.className = "loading";

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        status.textContent = "Enviando ubicación...";

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ nombre, lat, lng })
          });

          status.textContent = "✅ Ubicación registrada correctamente.";
          status.className = "ok";
        } catch (e) {
          status.textContent = "❌ Error al enviar. Intenta de nuevo.";
          status.className = "err";
        } finally {
          btn.disabled = false;
        }
      },
      (err) => {
        status.textContent = "❌ No se pudo obtener la ubicación: " + err.message;
        status.className = "err";
        btn.disabled = false;
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
</script>
</body>
</html>
